services:
  control:
    build: .
    container_name: control
    restart: unless-stopped
    ports:
      # 0.0.0.0 so the reverse proxy on a separate host can reach it over the LAN.
      - "0.0.0.0:3070:3000"
    environment:
      - PORT=3000
      # Generate one: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - SESSION_SECRET=${SESSION_SECRET:-please-change-me}
      # Public URL users visit (used in email links)
      - BASE_URL=${BASE_URL:-http://localhost:3070}
      # Set to 1 when serving over HTTPS through your reverse proxy
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Control <control@example.com>}
      # Per-file upload cap; Immich integration (optional) — link library
      # photos/videos into Moments via per-user API keys
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-512}
      - IMMICH_URL=${IMMICH_URL:-}
      - IMMICH_KEY=${IMMICH_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/data